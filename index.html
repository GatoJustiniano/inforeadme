<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Documentación</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/casualwriter/casual-markdown/dist/casual-markdown.css">
<script src="https://cdn.jsdelivr.net/gh/casualwriter/casual-markdown/dist/casual-markdown.js"></script>
<style>
  * {
    box-sizing: border-box
  }

  body {
    font-family: Verdana, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    margin: 0;
    background: #fff;
    color: #222;
  }

  a {
    background: transparent;
    text-decoration: none;
    color: grey
  }

  a:hover {
    background: #ffd700
  }

  nav p {
    border-bottom: 1px dotted grey;
    padding: 4px;
    font-weight: 700
  }

  nav li {
    margin-left: 12px
  }

  nav details {
    margin: 2px 0 6px 4px
  }

  nav summary {
    cursor: pointer;
    font-weight: 700
  }

  #header {
    background: grey;
    color: white;
    width: 100%;
    height: 60px;
  }

  #title {
    float: left;
    font-size: 18px;
    font-weight: 700;
    padding: 8px;
    cursor: pointer
  }

  #subtitle {
    font-size: 75%;
    padding: 8px;
    color: #eee
  }

  #menu button,
  #menu a {
    font-family: Verdana, Arial;
    border: none;
    padding: 4px 8px;
    color: inherit;
    background: inherit;
  }

  #menu button:hover,
  #menu a:hover {
    color: #222;
    background: #ffd700
  }

  #left-panel {
    position: absolute;
    left: 0;
    width: 340px;
    top: 60px;
    padding: 8px
  }

  #right-panel {
    position: absolute;
    right: 0;
    left: 360px;
    top: 60px;
    border-left: 1px solid grey;
    padding: 8px 16px
  }

  #right-panel img,
  #right-panel pre,
  #right-panel table {
    max-width: 100%;
    overflow-x: auto
  }

  .dark,
  .dark pre,
  .dark code,
  .dark blockquote {
    background: #333 !important;
    color: #ccc !important
  }

  .dark #header {
    background: #444
  }

  .dark a {
    color: #eee
  }

  .dark th,
  .dark tr:nth-child(even) {
    color: #333
  }

  @media print {

    #header,
    #left-panel {
      display: none !important
    }

    #right-panel {
      position: relative;
      width: 100% !important;
      left: 0px !important;
      top: 0px;
      border: none;
      height: auto;
      overflow: hidden
    }
  }

  @media screen and (min-width: 600px) and (max-width: 900px) {
    #header {
      width: 100%;
      height: 80px;
    }

    #left-panel {
      display: none;
      position: absolute;
      left: 0px !important;
      width: 100% !important;
      top: 80px;
      padding: 4px 8px
    }

    #right-panel {
      position: absolute;
      left: 0px !important;
      width: 100%;
      top: 80px;
      overflow: auto;
      padding: 4px 8px
    }
  }

  @media screen and (max-width: 600px) {
    #header {
      width: 100%;
      height: 100px;
    }

    #left-panel {
      display: none;
      position: absolute;
      left: 0px !important;
      width: 100% !important;
      top: 100px;
      padding: 4px 8px
    }

    #right-panel {
      position: absolute;
      left: 0px !important;
      width: 100%;
      top: 100px;
      overflow: auto;
      padding: 4px 8px
    }
  }
</style>
</head>

<body>

  <div id=header>
    <span id=menu style="float:right; padding:12px"></span>
    <span id=heading style="float:left">
      <span id=title title="Mostrar/ocultar menú">Documentación</span>
      <p id=subtitle></p>
    </span>
  </div>

  <div id=content>
    <div id="left-panel" style="display:none"></div>
    <div id="right-panel" style=""></div>
  </div>

  <button style="display:none" onclick="toggleHTML()" accesskey=s>VerHTML</button>
  <button style="display:none" onclick="darkmode()" accesskey=k>Oscuro</button>

  <script>
    /*****************************************************************************
     * Motor del sitio: convierte archivos markdown en un sitio de documentación.
     * Basado en casual-markdown-page v0.60 (c) 2022 Casualwriter (licencia MIT)
     * https://github.com/casualwriter/casual-markdown
     *
     * No es necesario editar este archivo para agregar documentos:
     * basta con crear el .md en docs/<tema>/ y registrarlo en index.md.
    *****************************************************************************/

    //=== muestra el HTML generado en el panel derecho (función oculta para desarrollo, Alt+S)
    function toggleHTML() {
      var html = document.getElementById('right-panel').innerHTML
      if (html.substr(0, 5) === '<xmp>') {
        document.getElementById('right-panel').innerHTML = html.substr(5, html.length - 11)
      } else {
        document.getElementById('right-panel').innerHTML = '<xmp>' + html.replace(/xmp\>/g, 'xmp&gt;') + '</xmp>'
      }
    }

    //=== alterna el modo oscuro y recuerda la elección entre páginas
    function darkmode() {
      var tema = (document.body.className === 'dark' ? 'claro' : 'dark')
      try { localStorage.setItem('tema', tema) } catch (e) { }
      document.body.className = (tema === 'dark' ? 'dark' : '')
    }

    //=== tema a aplicar: ?theme= > elección guardada > "theme" de index.md > preferencia del sistema
    md.getTheme = function (temaPortada) {
      var guardado = null
      try { guardado = localStorage.getItem('tema') } catch (e) { }
      var tema = md.params.theme || guardado || temaPortada
      if (!tema) tema = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : ''
      return tema === 'dark' ? 'dark' : ''
    }

    //=== carga un documento markdown en el panel derecho
    md.load = function (mdfile) {
      var xmlhttp = new XMLHttpRequest();
      xmlhttp.onload = function (e) {
        if (this.status == '404') {
          document.getElementById('md-post').innerHTML = '<h2>Página no encontrada</h2>'
            + '<p>No existe el documento <code>' + mdfile + '</code>. <a href="?' + md.home + '">Volver al inicio</a></p>'
        } else {
          document.getElementById('md-post').innerHTML = md.html(this.responseText) + '<br>'
          document.getElementById('right-panel').scrollTop = 0
          md.showTags(mdfile)
          var post = md.posts.find(function (p) { return p.file === mdfile })
          if (post) document.title = post.title + ' | ' + (md.yaml.title || 'Documentación')
        }
      }
      xmlhttp.open("GET", mdfile, true)
      xmlhttp.send();
    }

    //=== muestra fecha y etiquetas debajo del título del documento
    md.showTags = function (file) {
      var post = md.posts.find(function (p) { return p.file === file })
      var title = document.getElementById('md-post').querySelector('h1,h2,h3,h4')

      if (post && title) {
        var node = document.createElement("p");
        var html = '<span class="post-date">Fecha: ' + post.date
        html += '</span>&nbsp; <span class="post-tags">Etiquetas: '
        for (var i = 0; i < post.tags.length; i++) {
          html += '<a href="?' + md.home + 'tag=' + post.tags[i] + '">#' + post.tags[i] + '</a> '
        }
        node.innerHTML = html + '</span>'
        title.parentNode.insertBefore(node, title.nextSibling);
      }
    }

    //=== registra cada documento listado en index.md con el formato:
    //    "* aaaa/mm/dd: [Título](docs/tema/archivo.md) { #tema, #etiqueta }"
    md.getPosts = function (match, date, title, file, tags) {
      var post = { date: date.replace(/\//g, '-'), title: title, file: file, tags: tags.trim().split(/\s*,\s*/) }
      md.posts.push(post)

      // documentos por etiqueta (la primera etiqueta se usa como tema)
      for (var i = 0; i < post.tags.length; i++) {
        if (post.tags[i][0] === '#') post.tags[i] = post.tags[i].substr(1);
        if (!md.tags[post.tags[i]]) md.tags[post.tags[i]] = [];
        md.tags[post.tags[i]].push(post);
      }

      // documentos por mes
      var mth = post.date.substr(0, 7)
      if (!md.months[mth]) md.months[mth] = [];
      md.months[mth].push(post)

      return '* <a class="post-title" href="?' + md.home + 'post=' + file + '">' + title + '</a>'
        + ' <span class="post-date">' + post.date + '</span>'
    }

    //=== genera el menú lateral según "nav-group" := temas | featured | new-N | tags | months
    md.nav = function (options) {
      var navOpt = (options || 'temas, new-5, tags, months').split(',')
      var navDiv = '<nav>'

      for (var i = 0; i < navOpt.length; i++) {
        var opt = navOpt[i].trim()

        // documentos agrupados por tema (primera etiqueta de cada documento)
        if (opt === 'temas') {
          var temas = {}
          for (var x = 0; x < md.posts.length; x++) {
            var tema = md.posts[x].tags[0]
            if (!temas[tema]) temas[tema] = [];
            temas[tema].push(md.posts[x])
          }
          navDiv += '<p class="nav-title">Temas</p>'
          for (var t in temas) {
            navDiv += '<details open><summary class="nav-topic">' + t + ' <sup>(' + temas[t].length + ')</sup></summary>'
            for (var x = 0; x < temas[t].length; x++) {
              navDiv += '<li class="nav-post"><a href="?' + md.home + 'post=' + temas[t][x].file + '">' + temas[t][x].title + '</a></li>'
            }
            navDiv += '</details>'
          }

        // documentos destacados (etiqueta #destacado)
        } else if (opt === 'featured') {
          navDiv += '<p class="nav-title">Destacados</p>'
          for (var x = 0; md.tags.destacado && x < md.tags.destacado.length; x++) {
            navDiv += '<li class="nav-post"><a href="?' + md.home + 'post='
            navDiv += md.tags.destacado[x].file + '">' + md.tags.destacado[x].title + '</a></li>'
          }

        // últimos N documentos (ordenados por fecha)
        } else if (opt.substr(0, 4) === 'new-') {
          var max = parseInt(opt.substr(4), 10) || 5
          var recientes = md.posts.slice().sort(function (a, b) { return a.date < b.date ? 1 : -1 })
          navDiv += '<p class="nav-title">Recientes</p>'
          for (var x = 0; x < max && x < recientes.length; x++) {
            navDiv += '<li class="nav-post"><a href="?' + md.home + 'post='
            navDiv += recientes[x].file + '">' + recientes[x].title + '</a></li>'
          }

        // lista de etiquetas
        } else if (opt === 'tags') {
          navDiv += '<p class="nav-title">Etiquetas</p>'
          for (var tag in md.tags) {
            navDiv += '<li class="nav-tag"><a href="?' + md.home + 'tag=' + tag + '">' + tag + '</a>'
            navDiv += ' <sup>(' + md.tags[tag].length + ')</sup></li>'
          }

        // archivo por mes
        } else if (opt === 'months') {
          navDiv += '<p class="nav-title">Archivo</p>'
          var meses = Object.keys(md.months).sort().reverse()
          for (var m = 0; m < meses.length; m++) {
            navDiv += '<li class="nav-month"><a href="?' + md.home + 'month=' + meses[m] + '">' + md.monthName(meses[m]) + '</a>'
            navDiv += ' <sup>(' + md.months[meses[m]].length + ')</sup></li>'
          }
        }
      }

      document.getElementById('left-panel').innerHTML = navDiv + '</nav>'
    }

    //=== "2024-10" -> "Octubre 2024"
    md.monthName = function (mth) {
      var nombres = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio',
        'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre']
      return nombres[parseInt(mth.substr(5, 2), 10) - 1] + ' ' + mth.substr(0, 4)
    }

    //=== HTML de un documento dentro de un listado
    md.listPost = function (post) {
      var html = '\n<li><span class="post-date">' + post.date + '</span>: '
      html += '<a class="post-title" href="?' + md.home + 'post=' + post.file + '">' + post.title + '</a>'
      return html + ' <span class="post-tags">' + post.tags.map(function (t) { return '#' + t }).join(', ') + '</span>'
    }

    //=== listado de documentos con una etiqueta
    md.showTag = function (tag) {
      var html = '\n<h2>Documentos con la etiqueta <code>#' + tag + '</code></h2>\n<ul>\n'
      for (var i = 0; md.tags[tag] && i < md.tags[tag].length; i++) html += md.listPost(md.tags[tag][i])
      if (!md.tags[tag]) html += '<li>No hay documentos con esta etiqueta.</li>'
      document.getElementById('md-post').innerHTML = html + '\n</ul><br>'
    }

    //=== convierte enlaces a .md locales en enlaces internos antes de procesar el markdown
    md.before = function (text) {
      return text.replace(/\[(.*?)\]\(((?!https?:)[^)]*?\.md)\)/gm, '<a href="?' + md.home + 'post=$2">$1</a>')
    }

    //=== lee parámetros de la URL e inicializa los objetos del sitio
    md.params = {}
    window.location.href.replace(/[?&]+([^=&]+)=([^&]*)/gi, function (m, key, value) { md.params[key] = decodeURIComponent(value); });
    md.posts = []
    md.tags = {}
    md.months = {}
    md.home = (md.params.home ? 'home=' + md.params.home + '&' : '')
    md.home += (md.params.theme ? 'theme=' + md.params.theme + '&' : '')

    //=== aplica el tema de inmediato para evitar el parpadeo claro/oscuro al cambiar de página
    document.body.className = md.getTheme()

    //=== inicio de la página
    window.onload = function () {
      var xmlhttp = new XMLHttpRequest();

      xmlhttp.onload = function (e) {

        // lee el índice de documentos, genera el contenido y el menú lateral
        md.text = this.responseText.replace(/^\*\s*(.+?)\:\s*\[(.*?)\]\((.*?)\)\s+\{(.+)\}\s*$/gm, md.getPosts)
        document.getElementById('right-panel').innerHTML = md.html(md.text) + '<br>'
        md.nav(md.yaml['nav-group'])

        // tema, título y subtítulo
        document.body.className = md.getTheme(md.yaml.theme)
        document.title = document.getElementById('title').innerText = md.yaml.title || 'Documentación'
        document.getElementById('subtitle').innerText = md.yaml.subtitle || ''

        // menú superior
        var i, html = ''
        for (i in md.yaml.menu) html += '<a href="' + md.yaml.menu[i] + '">' + i + '</a>'
        document.getElementById('menu').innerHTML = html

        // parámetros de URL: ?page=, ?post=, ?tag=, ?month=
        if (md.params.page) {
          md.load(md.params.page)
        } else if (md.params.post) {
          md.load(md.params.post)
        } else if (md.params.tag) {
          md.showTag(md.params.tag)
        } else if (md.params.month) {
          var html = '\n<h2>Documentos de <code>' + md.monthName(md.params.month) + '</code></h2>\n<ul>\n'
          for (var i = 0; md.months[md.params.month] && i < md.months[md.params.month].length; i++)
            html += md.listPost(md.months[md.params.month][i])
          document.getElementById('md-post').innerHTML = html + '\n</ul><br>'
        }

        document.getElementById('right-panel').style.display = 'block'
        if (window.innerWidth >= 900) document.getElementById('left-panel').style.display = 'block'
      }

      xmlhttp.open("GET", md.params.home || 'index.md', true)
      xmlhttp.send();
    }

    //=== en móvil: tocar el título muestra/oculta el menú lateral
    if (window.innerWidth < 900) {
      function toggleTOC(show) {
        var disp = document.getElementById('left-panel').style.display
        document.getElementById('left-panel').style.display = show || (disp == 'none') ? 'block' : 'none'
        document.getElementById('right-panel').style.display = show || (disp == 'none') ? 'none' : 'block'
      }

      document.getElementById('left-panel').onclick = function () { toggleTOC(false) }
      document.getElementById('title').onclick = function () { toggleTOC() }
    }
  </script>
</body>
</html>
